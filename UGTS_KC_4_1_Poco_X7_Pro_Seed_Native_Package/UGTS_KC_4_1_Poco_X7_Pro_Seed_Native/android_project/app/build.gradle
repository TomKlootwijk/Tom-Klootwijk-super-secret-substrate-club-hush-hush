plugins { id "com.android.application" }

android {
    namespace "nl.tomklootwijk.ugtskc.spatial"
    compileSdk 36
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "nl.tomklootwijk.ugtskc.spatial"
        minSdk 26
        targetSdk 36
        versionCode 410
        versionName "4.1.0"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -Wall -Wextra -Wpedantic"
                arguments "-DANDROID_STL=c++_static", "-DUGTS41_PROFILE_HINT=auto"
            }
        }
    }

    flavorDimensions "device"
    productFlavors {
        universal {
            dimension "device"
            ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
        }
        pocoX7Pro {
            dimension "device"
            applicationIdSuffix ".poco"
            versionNameSuffix "-poco-x7-pro-seed"
            ndk { abiFilters "arm64-v8a" }
            externalNativeBuild { cmake { arguments "-DUGTS41_PROFILE_HINT=poco_x7_pro_12gb" } }
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            // Owner-device handoff: debug key and debuggable so Codex can install and use run-as.
            // Replace before external distribution.
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}
