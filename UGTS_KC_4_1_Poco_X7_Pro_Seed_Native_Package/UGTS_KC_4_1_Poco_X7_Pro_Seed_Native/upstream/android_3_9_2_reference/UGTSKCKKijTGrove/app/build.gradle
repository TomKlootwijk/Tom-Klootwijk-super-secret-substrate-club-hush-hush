plugins {
    id "com.android.application"
}

android {
    namespace "nl.tomklootwijk.ugtskc.grove"
    compileSdk 36
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "nl.tomklootwijk.ugtskc.grove"
        minSdk 26
        targetSdk 36
        versionCode 392
        versionName "3.9.2"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -Wall -Wextra -Wpedantic"
                arguments "-DANDROID_STL=c++_static", "-DUGTS_KC_PROFILE_HINT=auto"
            }
        }
    }

    flavorDimensions "device"
    productFlavors {
        universal {
            dimension "device"
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            }
        }
        pocoX7Pro {
            dimension "device"
            applicationIdSuffix ".poco"
            versionNameSuffix "-poco-x7-pro-grove"
            ndk {
                abiFilters "arm64-v8a"
            }
            externalNativeBuild {
                cmake {
                    arguments "-DUGTS_KC_PROFILE_HINT=poco_x7_pro_12gb"
                }
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            // This is intentionally debug-key signed for direct owner-device deployment.
            // Replace it with a private release key before distributing outside this device.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}
