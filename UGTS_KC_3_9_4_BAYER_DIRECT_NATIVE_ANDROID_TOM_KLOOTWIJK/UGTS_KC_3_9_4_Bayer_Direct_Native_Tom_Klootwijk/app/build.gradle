plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.tomklootwijk.ugtskc.bayer.poco'
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'nl.tomklootwijk.ugtskc.bayer.poco'
        minSdk 26
        targetSdk 36
        versionCode 394
        versionName '3.9.4-bayer-direct-v001'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                cFlags '-Oz -flto -ffunction-sections -fdata-sections -fvisibility=hidden -fomit-frame-pointer -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            ndk {
                debugSymbolLevel 'none'
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/**']
        }
    }
}
