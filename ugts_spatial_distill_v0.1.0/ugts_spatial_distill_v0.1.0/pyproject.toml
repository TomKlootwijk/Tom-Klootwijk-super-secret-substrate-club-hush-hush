[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugts-spatial-distill"
version = "0.1.0"
description = "Sparse temporal geospatial GNN knowledge distillation with a UGTS query-first event gate"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Engineering launchpad generated from user-supplied UGTS substrate"}]
dependencies = ["numpy>=1.26", "torch>=2.7"]

[project.optional-dependencies]
h3 = ["h3>=4.1"]
dev = ["pytest>=8"]

[project.scripts]
ugts-spatial = "ugts_spatial.cli:main"

[tool.setuptools]
packages = ["ugts_spatial"]

[tool.setuptools.package-data]
ugts_spatial = ["resources/*.json", "resources/*.py", "resources/*LICENSE*"]
